name: S146 C12 true Win64 hide-show documented origin branch, TEST-OWNED NOT PRODUCT
on:
  push:
    paths:
      - "src/window_hide.py"
      - "tools/S146_WINDOWS_C12_SHOW_ORIGIN_SMOKE.py"
      - "tests/test_s146.py"
      - "docs/tasks/S146.md"
      - "docs/memory/S146_C12_ORIGIN_BRANCH_EVIDENCE.json"
      - ".github/workflows/s146-c12-document-origin.yml"
      - "tools/S139_WINDOWS_ORIGINAL_BUILD_FILE_SMOKE.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s146-native:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"
          architecture: x64
      - run: python -m pip install Pillow==11.3.0
      - run: python -m compileall -q src tests tools
      - run: python -m unittest discover -s tests -p "test_s*.py" -v
      - run: python tools/S86_AUDIT_SOURCE_BUILD_GAPS.py
      - name: S146 REAL Win64 original C12 documented show at (0,0) after actual off-screen hide on TEST-OWNED Tk HWND
        run: python tools/S146_WINDOWS_C12_SHOW_ORIGIN_SMOKE.py
      - name: Inherited S145 true Win64 PrintWindow full-window capture, original F06 RGB UNKNOWN
        run: python tools/S145_WINDOWS_PRINTWINDOW_NATIVE_SMOKE.py
      - name: Inherited S144 true native F06 background WM_CHAR into owned EDIT
        run: python tools/S144_WINDOWS_F06_NATIVE_WM_CHAR_SMOKE.py
      - name: Inherited S143 real master screen to client WinAPI, two slaves model ONLY
        run: python tools/S143_WINDOWS_C19_SCREEN_TO_CLIENT_SMOKE.py
      - name: Inherited S142 native Windows Tk F09 time save
        run: python tools/S142_WINDOWS_LOGIN_TIME_CONCURRENT_SMOKE.py
      - name: Inherited S111 actual Windows Tk original F09 HHMM time controls
        run: python tools/S111_WINDOWS_LOGIN_SCHEDULE_TIME_SMOKE.py
      - name: Inherited S141 real F04 chooser preserves legacy account bytes
        run: python tools/S141_WINDOWS_LOGIN_GAME_DIR_BYTE_SAFE_SMOKE.py
      - name: Inherited S25 native Win64 real Login file chooser behavior
        run: python tools/S25_WINDOWS_LOGIN_FOLDER_SMOKE.py
      - name: Inherited S140 twelve independent Win64 S134 owned pointer traces
        run: python tools/S140_REPEAT_S134_NATIVE.py
      - name: Inherited S139 native real Win64 file identity, test-owned only
        run: python tools/S139_WINDOWS_ORIGINAL_BUILD_FILE_SMOKE.py
      - name: Inherited S138 missing-resource fail-closed check
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/s139 -Force | Out-Null
          python tools/S138_CATALOG_LOOKUP.py --item-id 10100000 > artifacts/s139/s138_missing_resource.txt 2>&1
          if ($LASTEXITCODE -ne 2) { throw "S146_MISSING_CATALOG_NOT_BLOCKED" }
          if ((Get-Content -Raw artifacts/s139/s138_missing_resource.txt) -notmatch "BLOCKED_CATALOG_NOT_VERIFIED") { throw "S146_RESOURCE_FAIL_OPEN" }
          Write-Host "S146_INHERITED_S138_RESOURCE=BLOCKED"
          exit 0
      - name: Inherited S136 offline marker parser self-test (frozen ZIP not in CI)
        run: python tools/S136_AUDIT_ORIGINAL_BAG_CONSTANTS.py --self-test
      - name: Inherited S135 real Win64 read-only test-owned Site10 dictionary tri-state
        run: python tools/S135_WINDOWS_SITE10_TRISTATE_SMOKE.py
      - name: Inherited S134 real Win64 owned RoleData chain native
        run: python tools/S134_WINDOWS_ROLE_CHAIN_FIXTURE_SMOKE.py
      - name: Inherited S133 Win32 readonly self PE native
        run: python tools/S133_WINDOWS_READONLY_GA_PROBE_SMOKE.py
      - name: Inherited S132 composed true Train native
        run: python tools/S132_WINDOWS_TRAIN_COMPOSITION_SMOKE.py
      - name: Inherited S131 original Farm buff native
        run: python tools/S131_WINDOWS_TRAIN_BUFF_SMOKE.py
      - name: Inherited S130 original town trade native
        run: python tools/S130_WINDOWS_H02_TOWN_TRADE_SMOKE.py
      - name: Inherited S129 original Train settings native
        run: python tools/S129_WINDOWS_H06_H09_TRAIN_CONFIG_SMOKE.py
      - name: Inherited S128 true H02 town native
        run: python tools/S128_WINDOWS_H02_TOWN_SETTINGS_SMOKE.py
      - name: Inherited S127 S126 S125 S124 S123 S122 S121 S120 S119 native
        run: |
          python tools/S127_WINDOWS_H12_STATE_LABEL_SMOKE.py
          python tools/S126_WINDOWS_TRAIN_EXTRA_TRACKER_SMOKE.py
          python tools/S125_WINDOWS_TRAIN_CHARACTER_SAMPLES_SMOKE.py
          python tools/S124_WINDOWS_TRAIN_AUTH_GATE_SMOKE.py
          python tools/S123_WINDOWS_TRAIN_ACCOUNT_ROWS_SMOKE.py
          python tools/S122_WINDOWS_FARM_ACCOUNT_COMBO_SMOKE.py
          python tools/S121_WINDOWS_FARM_SAVED_EDITOR_SMOKE.py
          python tools/S120_WINDOWS_FARM_ORIGINAL_MAPS_SMOKE.py
          python tools/S119_WINDOWS_FARM_COORDINATES_SMOKE.py
      - name: Inherited Party/Login native tests
        run: |
          python tools/S118_WINDOWS_PARTY_AFTER_RADIO_SMOKE.py
          python tools/S89_WINDOWS_G08_PARTY_CONFIG_EDITOR_SMOKE.py
          python tools/S91_WINDOWS_G02_PARTY_READY_NATIVE_SMOKE.py
          python tools/S93_WINDOWS_G09_TK_OWNER_STATUS_SMOKE.py
          python tools/S117_WINDOWS_F02_SAVE_FEEDBACK_SMOKE.py
          python tools/S116_WINDOWS_LOGIN_EXISTING_ACCOUNT_SMOKE.py
      - name: Genuine signed Info gate still rejects product
        shell: pwsh
        run: |
          python src/TLMTool.py 2>&1 | Out-File -Encoding utf8 artifacts/s135/signed_gate.txt
          if ($LASTEXITCODE -ne 2) { throw "S146_UNVERIFIED_PRODUCT_GUI_STARTED" }
          if ((Get-Content -Raw artifacts/s135/signed_gate.txt) -notmatch "S01 BLOCKED") { throw "S146_INFO_GATE_BYPASS" }
          Write-Host "S146_PRODUCT=EXPLICITLY_BLOCKED_NO_GUI_NOT_PRODUCT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S146_C12_REAL_WINDOWS_ORIGIN_BRANCH_TEST_ONLY_NOT_PRODUCT
          path: |
            artifacts/s146/
            artifacts/s145/
            artifacts/s144/
            artifacts/s143/
            artifacts/s142/
            artifacts/s141/
            artifacts/s140/
            artifacts/s139/
            artifacts/s138/
            artifacts/s135/
            artifacts/s134/
            artifacts/s86/source_and_product_gate_audit.json
          if-no-files-found: warn
