name: S30 Windows Toolhelp process snapshot provenance and staleness

on:
  push:
    paths:
      - "src/running_count_provenance.py"
      - "tests/test_s30.py"
      - "tools/S30_WINDOWS_COUNT_PROVENANCE_SMOKE.py"
      - ".github/workflows/s30-native-provenance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s30-native:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile Stage S and S30 native smoke
        run: python -m compileall -q src tests tools/S30_WINDOWS_COUNT_PROVENANCE_SMOKE.py
      - name: S01-S30 complete unit regression
        run: python -m unittest discover -s tests -p "test_s*.py" -v
      - name: S30 real Windows double Toolhelp process, S08 HWND and freshness
        run: python tools/S30_WINDOWS_COUNT_PROVENANCE_SMOKE.py
      - name: S29 native process and HWND partial counts
        run: python tools/S29_WINDOWS_PARTIAL_COUNT_SMOKE.py
      - name: S28 x64 PE input/env native
        run: python tools/S28_WINDOWS_LAUNCH_INPUTS_SMOKE.py
      - name: S27 native deferred HWND
        run: python tools/S27_WINDOWS_PID_HWND_HANDOFF_SMOKE.py
      - name: S26 native PID HWND
        run: python tools/S26_WINDOWS_F05_PREFLIGHT_HWND_SMOKE.py
      - name: S25 native Login game directory
        run: python tools/S25_WINDOWS_LOGIN_FOLDER_SMOKE.py
      - name: S24 native Tk normal destroy
        run: python tools/S24_WINDOWS_DESTROY_SMOKE.py
      - name: S23 native session tee
        run: python tools/S23_WINDOWS_TEE_SMOKE.py
      - name: S22 native diagnostics
        run: python tools/S22_WINDOWS_DIAGNOSTICS_SMOKE.py
      - name: S21 native mutex
        run: python tools/S21_WINDOWS_MUTEX_SMOKE.py
      - name: S20 native three HWND
        run: python tools/S20_WINDOWS_THREE_HWND_COMBINED_SMOKE.py
      - name: S10 native Start
        run: python tools/S10_WINDOWS_START_VIEW_SMOKE.py
      - name: Upload S30 native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s30-native-process-provenance-and-regressions
          path: |
            artifacts/s30/
            artifacts/s29/
            artifacts/s28/
            artifacts/s27/
            artifacts/s26/
            artifacts/s25/
            artifacts/s24/
            artifacts/s23/
            artifacts/s22/
            artifacts/s21/
            artifacts/s20/
            artifacts/s10/
          if-no-files-found: warn
