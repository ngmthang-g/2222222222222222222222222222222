name: S169 Independent Train LSV Config Windows Native and Partial EXE
on:
  pull_request:
    paths:
      - "src/train_lsv_top_settings.py"
      - "src/train_lsv_top_tab.py"
      - "src/TLMToolIndependent.py"
      - "src/local_feature_policy.py"
      - "src/local_tool_status_tab.py"
      - "tests/test_s169.py"
      - "tests/test_s168.py"
      - "tools/S169_WINDOWS_LSV_TOP_SMOKE.py"
      - "tools/S168_WINDOWS_INDEPENDENT_TOOL_SMOKE.py"
      - ".github/workflows/s169-train-lsv-local-config.yml"
  push:
    paths:
      - "src/train_lsv_top_settings.py"
      - "src/train_lsv_top_tab.py"
      - "src/TLMToolIndependent.py"
      - "src/local_feature_policy.py"
      - "src/local_tool_status_tab.py"
      - "tests/test_s169.py"
      - "tests/test_s168.py"
      - "tools/S169_WINDOWS_LSV_TOP_SMOKE.py"
      - "tools/S168_WINDOWS_INDEPENDENT_TOOL_SMOKE.py"
      - ".github/workflows/s169-train-lsv-local-config.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  win64-real-lsv-settings-and-independent-exe:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"
          architecture: x64
      - run: python -m pip install Pillow==11.3.0
      - run: python -m compileall -q src tests tools
      - name: All historical and new Python Windows regression tests
        run: python -m unittest discover -s tests -p "test_s*.py" -v
      - name: S86 historical source structure audit
        run: python tools/S86_AUDIT_SOURCE_BUILD_GAPS.py
      - name: S169 genuine Win64 Tk Train LSV config, actual INI isolated edit
        run: python tools/S169_WINDOWS_LSV_TOP_SMOKE.py
      - name: S168 inherited independent GUI and Train native regression
        run: python tools/S168_WINDOWS_INDEPENDENT_TOOL_SMOKE.py
      - name: S167 historical authorization-mode Tk regression
        run: python tools/S167_WINDOWS_INFO_TRAIN_REVOKE_SMOKE.py
      - name: S166 historical shared Win32 Start lifecycle
        run: python tools/S166_WINDOWS_TRAIN_LIFECYCLE_SMOKE.py
      - name: S165 historical Tk Train config builder
        run: python tools/S165_WINDOWS_E03_TRAIN_BUILDER_SMOKE.py
      - name: S132 inherited Train config native
        run: python tools/S132_WINDOWS_TRAIN_COMPOSITION_SMOKE.py
      - name: S163 inherited Login Tk native
        run: python tools/S163_WINDOWS_F06_SELECTED_ACCOUNT_TK_SMOKE.py
      - name: Independent entrypoint static self check
        run: python src/TLMToolIndependent.py --self-check
      - name: Install pinned existing diagnostic packaging dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build-s36.txt
      - name: Build independent source-backed PARTIAL Windows EXE
        run: >
          python -m PyInstaller
          --noconfirm --clean --onedir --console --noupx
          --name S169_TLMTOOL_INDEPENDENT_LSV_PARTIAL
          --distpath artifacts/s169/dist
          --workpath artifacts/s169/build
          --specpath artifacts/s169/spec
          --paths src
          src/TLMToolIndependent.py
      - name: Verify packaged partial independent EXE self-check
        shell: pwsh
        run: |
          & "artifacts/s169/dist/S169_TLMTOOL_INDEPENDENT_LSV_PARTIAL/S169_TLMTOOL_INDEPENDENT_LSV_PARTIAL.exe" --self-check
          if ($LASTEXITCODE -ne 0) { throw "S169_PACKAGED_BOOTSTRAP_FAILED" }
      - name: Preserve legacy S01 diagnostic fail-closed (not new runtime)
        shell: pwsh
        run: |
          python src/TLMTool.py *> artifacts/s169/legacy_entry.txt
          if ($LASTEXITCODE -ne 2) { throw "S169_LEGACY_DIAGNOSTIC_NOT_PRESERVED" }
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S169_INDEPENDENT_TRAIN_LSV_CONFIG_PARTIAL_WINDOWS_X64_NOT_GAME
          path: |
            artifacts/s169/dist/S169_TLMTOOL_INDEPENDENT_LSV_PARTIAL/
            artifacts/s169/native_lsv_config.json
            artifacts/s169/legacy_entry.txt
            artifacts/s168/
            artifacts/s167/
            artifacts/s166/
            artifacts/s165/
            artifacts/s132/
            artifacts/s163/
          if-no-files-found: warn
