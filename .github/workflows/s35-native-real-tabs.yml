name: S35 Windows real E03 Start/Login lazy factory integration

on:
  push:
    paths:
      - "src/source_backed_tab_builders.py"
      - "src/TLMTool.py"
      - "tests/test_s35.py"
      - "tools/S35_WINDOWS_E03_REAL_TAB_SMOKE.py"
      - ".github/workflows/s35-native-real-tabs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s35-native:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile Stage S and S35 Windows smoke
        run: python -m compileall -q src tests tools/S35_WINDOWS_E03_REAL_TAB_SMOKE.py
      - name: S01-S35 full unit regressions
        run: python -m unittest discover -s tests -p "test_s*.py" -v
      - name: S35 native real Tk Login path and Start Win32 with test claims
        run: python tools/S35_WINDOWS_E03_REAL_TAB_SMOKE.py
      - name: S34 strict offline ADB intake
        run: python tools/S34_WINDOWS_OFFLINE_INTAKE_SMOKE.py
      - name: S33 offline ADB serial epochs
        run: python tools/S33_WINDOWS_ADB_EPOCH_SMOKE.py
      - name: S32 offline hint timestamps
        run: python tools/S32_WINDOWS_HINT_PROVENANCE_SMOKE.py
      - name: S31 offline captured ADB clone identity
        run: python tools/S31_WINDOWS_OFFLINE_ADB_IDENTITY_SMOKE.py
      - name: S30 native Toolhelp double process scan
        run: python tools/S30_WINDOWS_COUNT_PROVENANCE_SMOKE.py
      - name: S29 native Toolhelp process count
        run: python tools/S29_WINDOWS_PARTIAL_COUNT_SMOKE.py
      - name: S28 native structural launch inputs
        run: python tools/S28_WINDOWS_LAUNCH_INPUTS_SMOKE.py
      - name: S27 native delayed HWND
        run: python tools/S27_WINDOWS_PID_HWND_HANDOFF_SMOKE.py
      - name: S26 native login PID preflight
        run: python tools/S26_WINDOWS_F05_PREFLIGHT_HWND_SMOKE.py
      - name: S25 native login path chooser
        run: python tools/S25_WINDOWS_LOGIN_FOLDER_SMOKE.py
      - name: S24 native Tk destroy
        run: python tools/S24_WINDOWS_DESTROY_SMOKE.py
      - name: S23 native session tee
        run: python tools/S23_WINDOWS_TEE_SMOKE.py
      - name: S22 native diagnostics
        run: python tools/S22_WINDOWS_DIAGNOSTICS_SMOKE.py
      - name: S21 native mutex
        run: python tools/S21_WINDOWS_MUTEX_SMOKE.py
      - name: S20 native multi HWND
        run: python tools/S20_WINDOWS_THREE_HWND_COMBINED_SMOKE.py
      - name: S10 native Start
        run: python tools/S10_WINDOWS_START_VIEW_SMOKE.py
      - name: Upload native integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s35-real-e03-start-login-integration-windows
          path: |
            artifacts/s35/
            artifacts/s34/
            artifacts/s33/
            artifacts/s32/
            artifacts/s31/
            artifacts/s30/
            artifacts/s29/
            artifacts/s28/
            artifacts/s27/
            artifacts/s26/
            artifacts/s25/
            artifacts/s24/
            artifacts/s23/
            artifacts/s22/
            artifacts/s21/
            artifacts/s20/
            artifacts/s10/
          if-no-files-found: warn
