name: S167 Real E03 Info heartbeat Train Tk authorization revocation Win64 NOT PRODUCT
on:
  pull_request:
    paths:
      - "src/shell.py"
      - "tests/test_s167.py"
      - "tools/S167_WINDOWS_INFO_TRAIN_REVOKE_SMOKE.py"
      - ".github/workflows/s167-info-train-revocation.yml"
  push:
    paths:
      - "src/shell.py"
      - "tests/test_s167.py"
      - "tools/S167_WINDOWS_INFO_TRAIN_REVOKE_SMOKE.py"
      - ".github/workflows/s167-info-train-revocation.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s167-real-win64-info-train:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"
          architecture: x64
      - run: python -m pip install Pillow==11.3.0
      - run: python -m compileall -q src tests tools
      - run: python -m unittest discover -s tests -p "test_s*.py" -v
      - run: python tools/S86_AUDIT_SOURCE_BUILD_GAPS.py
      - name: S167 real E03 Win64 Tk Notebook info revoke + resume existing Train
        run: python tools/S167_WINDOWS_INFO_TRAIN_REVOKE_SMOKE.py
      - name: S166 genuine Win64 shared Start producer native
        run: python tools/S166_WINDOWS_TRAIN_LIFECYCLE_SMOKE.py
      - name: S165 real Tk existing Train tab native
        run: python tools/S165_WINDOWS_E03_TRAIN_BUILDER_SMOKE.py
      - name: S132 real Tk Train full source config native
        run: python tools/S132_WINDOWS_TRAIN_COMPOSITION_SMOKE.py
      - name: S163 real Tk Login selected account regression
        run: python tools/S163_WINDOWS_F06_SELECTED_ACCOUNT_TK_SMOKE.py
      - name: S162 native Win32 game executable spelling
        run: python tools/S162_WINDOWS_DUAL_GAME_NAME_COUNT_SMOKE.py
      - name: S160 native process count
        run: python tools/S160_WINDOWS_F05_LIVE_EXE_COUNT_SMOKE.py
      - name: S155 Party roster E03 native
        run: python tools/S155_WINDOWS_PARTY_READY_LIFECYCLE_SMOKE.py
      - name: S154 Party config E03 native
        run: python tools/S154_WINDOWS_PARTY_BUILDER_SMOKE.py
      - name: S151 Login 100 Tk rows
        run: python tools/S151_WINDOWS_LOGIN_ACCOUNT_WHEEL_SMOKE.py
      - name: S146 original Win32 hide/show
        run: python tools/S146_WINDOWS_C12_SHOW_ORIGIN_SMOKE.py
      - name: S35 real Start/Login E03 native regression
        run: python tools/S35_WINDOWS_E03_REAL_TAB_SMOKE.py
      - name: Public product entrypoint must STILL deny missing signed Info
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/s167 | Out-Null
          python src/TLMTool.py 2>&1 | Out-File -Encoding utf8 artifacts/s167/product_gate.txt
          if ($LASTEXITCODE -ne 2) { throw "S167_UNVERIFIED_PRODUCT_GUI_STARTED" }
          if ((Get-Content -Raw artifacts/s167/product_gate.txt) -notmatch "S01 BLOCKED") { throw "S167_INFO_GATE_BYPASS" }
          Write-Host "S167_PRODUCT=EXPLICITLY_BLOCKED_NO_GUI_NOT_PRODUCT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S167_E03_REAL_TK_INFO_TRAIN_AUTH_LIFECYCLE_TEST_ONLY_NOT_PRODUCT
          path: |
            artifacts/s167/
            artifacts/s166/
            artifacts/s165/
            artifacts/s132/
            artifacts/s163/
            artifacts/s162/
            artifacts/s160/
            artifacts/s155/
            artifacts/s154/
            artifacts/s151/
            artifacts/s146/
            artifacts/s35/
            artifacts/s86/source_and_product_gate_audit.json
          if-no-files-found: warn
