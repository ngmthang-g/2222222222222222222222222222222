name: S157 F05 real Windows minimal child environment test-owned NOT PRODUCT
on:
  pull_request:
    paths:
      - "src/login_safe_env.py"
      - "tests/test_s157.py"
      - "tools/S157_WINDOWS_F05_CLEAN_ENV_SMOKE.py"
      - ".github/workflows/s157-f05-safe-env.yml"
  push:
    paths:
      - "src/login_safe_env.py"
      - "tests/test_s157.py"
      - "tools/S157_WINDOWS_F05_CLEAN_ENV_SMOKE.py"
      - ".github/workflows/s157-f05-safe-env.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s157-native-windows-clean-env:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"
          architecture: x64
      - run: python -m pip install Pillow==11.3.0
      - run: python -m compileall -q src tests tools
      - run: python -m unittest discover -s tests -p "test_s*.py" -v
      - run: python tools/S86_AUDIT_SOURCE_BUILD_GAPS.py
      - name: S157 two actual Win64 child processes receive filtered F05 env
        run: python tools/S157_WINDOWS_F05_CLEAN_ENV_SMOKE.py
      - name: S156 real Win64 F05 main-HWND discovery regression
        run: python tools/S156_WINDOWS_F05_PID_HWND_SMOKE.py
      - name: S155 Win64 real Party G02 three HWND lifecycle
        run: python tools/S155_WINDOWS_PARTY_READY_LIFECYCLE_SMOKE.py
      - name: S154 Win64 real Party G08 Tk settings
        run: python tools/S154_WINDOWS_PARTY_BUILDER_SMOKE.py
      - name: S153 native original crash handler taskkill TEST OWNED
        run: python tools/S153_WINDOWS_C16_CRASHHANDLER_SMOKE.py
      - name: S152 native C14 DWM Info provider fails closed
        run: python tools/S152_WINDOWS_C14_AUTH_EXCEPTION_SMOKE.py
      - name: S151 Login real Tk account wheel
        run: python tools/S151_WINDOWS_LOGIN_ACCOUNT_WHEEL_SMOKE.py
      - name: S150 C12 original native read-only observer
        run: python tools/S150_WINDOWS_C12_OBSERVER_OWNED_SMOKE.py
      - name: S146 C12 2 native Win64 owned HWND regression
        run: python tools/S146_WINDOWS_C12_SHOW_ORIGIN_SMOKE.py
      - name: Product Info entitlement still strictly blocks UI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/s157 | Out-Null
          python src/TLMTool.py 2>&1 | Out-File -Encoding utf8 artifacts/s157/product_gate.txt
          if ($LASTEXITCODE -ne 2) { throw "S157_UNVERIFIED_PRODUCT_GUI_STARTED" }
          if ((Get-Content -Raw artifacts/s157/product_gate.txt) -notmatch "S01 BLOCKED") { throw "S157_INFO_GATE_BYPASS" }
          Write-Host "S157_PRODUCT=EXPLICITLY_BLOCKED_NO_GUI_NOT_PRODUCT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S157_WIN64_F05_CLEAN_CHILD_ENV_TEST_OWNED_NOT_PRODUCT
          path: |
            artifacts/s157/
            artifacts/s156/
            artifacts/s155/
            artifacts/s154/
            artifacts/s153/
            artifacts/s152/
            artifacts/s151/
            artifacts/s150/
            artifacts/s146/
            artifacts/s86/source_and_product_gate_audit.json
          if-no-files-found: warn
