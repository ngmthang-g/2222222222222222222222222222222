name: S21 E01 Windows named single-instance mutex lifecycle

on:
  push:
    paths:
      - "src/single_instance.py"
      - "src/TLMTool.py"
      - "tests/test_s21.py"
      - "tools/S21_WINDOWS_MUTEX_SMOKE.py"
      - ".github/workflows/s21-native-mutex.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-mutex-lifecycle:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout actual committed source
        uses: actions/checkout@v4
      - name: Python 3.10 Windows
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Compile Stage S and native fixtures
        run: python -m compileall -q src tests tools/S21_WINDOWS_MUTEX_SMOKE.py tools/S20_WINDOWS_THREE_HWND_COMBINED_SMOKE.py
      - name: All S01-S21 unit regressions
        run: python -m unittest discover -s tests -p "test_s*.py" -v
      - name: Real Win32 CreateMutexW two-process collision graceful and forced exit
        run: python tools/S21_WINDOWS_MUTEX_SMOKE.py
      - name: Recheck S20 test-owned 3-HWND DWM and grid integration
        run: python tools/S20_WINDOWS_THREE_HWND_COMBINED_SMOKE.py
      - name: Upload Win32 mutex and prior integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s21-win32-test-only-mutex
          path: |
            artifacts/s21/
            artifacts/s20/
          if-no-files-found: warn
