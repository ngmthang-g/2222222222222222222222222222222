name: S88 native C04 automatic DWM source-loss cleanup - TEST ONLY
on:
  push:
    paths:
      - "src/start_tab.py"
      - "tests/test_s88.py"
      - "tools/S88_WINDOWS_C04_AUTO_SOURCE_LOSS_DWM_FAULT_SMOKE.py"
      - ".github/workflows/s88-native-c04-auto-source-loss.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s88-native:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install previous native screenshot test requirement
        run: python -m pip install Pillow==11.3.0
      - name: Compile all Stage-S sources including S88
        run: python -m compileall -q src tests tools
      - name: Complete S01-S88 unit regression
        run: python -m unittest discover -s tests -p "test_s*.py" -v
      - name: Original S86 no-product auth and source audit
        run: python tools/S86_AUDIT_SOURCE_BUILD_GAPS.py
      - name: S88 genuine native DWM automatic source-loss cleanup
        run: python tools/S88_WINDOWS_C04_AUTO_SOURCE_LOSS_DWM_FAULT_SMOKE.py
      - name: Prior S76 explicit manual C15 native cleanup regression
        run: python tools/S76_WINDOWS_C15_REFRESH_DWM_FAULT_SMOKE.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s88-native-C04-auto-source-loss-test-owned-not-game
          path: |
            artifacts/s88/
            artifacts/s76/
            artifacts/s86/
          if-no-files-found: warn
