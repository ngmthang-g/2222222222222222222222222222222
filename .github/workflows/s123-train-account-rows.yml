name: S123 H12 real Win32 HWND PID Tk account identity lifecycle - NOT PRODUCT
on:
  push:
    paths:
      - "src/train_account_rows.py"
      - "tests/test_s123.py"
      - "tools/S123_WINDOWS_TRAIN_ACCOUNT_ROWS_SMOKE.py"
      - ".github/workflows/s123-train-account-rows.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s123-native:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"
          architecture: x64
      - run: python -m pip install Pillow==11.3.0
      - run: python -m compileall -q src tests tools
      - run: python -m unittest discover -s tests -p "test_s*.py" -v
      - run: python tools/S86_AUDIT_SOURCE_BUILD_GAPS.py
      - name: Real Win32 HWND PID test-owned Tk + original H12 identity
        run: python tools/S123_WINDOWS_TRAIN_ACCOUNT_ROWS_SMOKE.py
      - name: Native inherited S122 S121 S120 S119
        run: |
          python tools/S122_WINDOWS_FARM_ACCOUNT_COMBO_SMOKE.py
          python tools/S121_WINDOWS_FARM_SAVED_EDITOR_SMOKE.py
          python tools/S120_WINDOWS_FARM_ORIGINAL_MAPS_SMOKE.py
          python tools/S119_WINDOWS_FARM_COORDINATES_SMOKE.py
      - name: Native inherited S118 S89 S91 S93 S117 S116
        run: |
          python tools/S118_WINDOWS_PARTY_AFTER_RADIO_SMOKE.py
          python tools/S89_WINDOWS_G08_PARTY_CONFIG_EDITOR_SMOKE.py
          python tools/S91_WINDOWS_G02_PARTY_READY_NATIVE_SMOKE.py
          python tools/S93_WINDOWS_G09_TK_OWNER_STATUS_SMOKE.py
          python tools/S117_WINDOWS_F02_SAVE_FEEDBACK_SMOKE.py
          python tools/S116_WINDOWS_LOGIN_EXISTING_ACCOUNT_SMOKE.py
      - name: Genuine Info gate fail closed, not a functional TLM product
        shell: pwsh
        run: |
          python src/TLMTool.py 2>&1 | Out-File -Encoding utf8 artifacts/s123/gate.txt
          if ($LASTEXITCODE -ne 2) { throw "UNVERIFIED_S123_PRODUCT_STARTED" }
          if ((Get-Content -Raw artifacts/s123/gate.txt) -notmatch "S01 BLOCKED") { throw "INFO_GUARD_NOT_PRESERVED" }
          Write-Host "S123_PRODUCT=EXPLICITLY_BLOCKED_NO_GUI_NOT_PRODUCT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S123_NATIVE_H12_WIN32_HWND_PID_TK_ACCOUNT_ROWS_NOT_PRODUCT
          path: |
            artifacts/s123/
            artifacts/s86/source_and_product_gate_audit.json
          if-no-files-found: warn
