name: S98 G10 native read epochs two test-owned Win32 PIDs
on:
  push:
    paths:
      - "src/party_member_epoch.py"
      - "tests/test_s98.py"
      - "tools/S98_WINDOWS_G10_TWO_PID_EPOCH_SMOKE.py"
      - ".github/workflows/s98-party-epoch-native.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s98-native:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install existing image baseline dependency
        run: python -m pip install Pillow==11.3.0
      - name: Compile all Python source, tests and tools
        run: python -m compileall -q src tests tools
      - name: Run full S01-S98 Python unit suite
        run: python -m unittest discover -s tests -p "test_s*.py" -v
      - name: Run S86 original source audit and blocked product check
        run: python tools/S86_AUDIT_SOURCE_BUILD_GAPS.py
      - name: S98 native test-owned TWO real Windows PID epoch comparison
        run: python tools/S98_WINDOWS_G10_TWO_PID_EPOCH_SMOKE.py
      - name: S97 native per-member regression
        run: python tools/S97_WINDOWS_G10_TWO_PID_MEMBER_SNAPSHOT_SMOKE.py
      - name: S96 native B3 diagnostic regression
        run: python tools/S96_WINDOWS_G10_TWO_PID_BURST_REPORT_SMOKE.py
      - name: S95 native TeamID wait regression
        run: python tools/S95_WINDOWS_G10_TEAM_WAIT_NATIVE_SMOKE.py
      - name: S94 native RoleID TeamID regression
        run: python tools/S94_WINDOWS_G10_TEAM_IDENTITY_NATIVE_SMOKE.py
      - name: S93 native Tk status regression
        run: python tools/S93_WINDOWS_G09_TK_OWNER_STATUS_SMOKE.py
      - name: S92 native event regression
        run: python tools/S92_WINDOWS_G09_PARTY_EVENT_NATIVE_SMOKE.py
      - name: S91 native list regression
        run: python tools/S91_WINDOWS_G02_PARTY_READY_NATIVE_SMOKE.py
      - name: S90 native roster regression
        run: python tools/S90_WINDOWS_G02_PARTY_ROSTER_NATIVE_SMOKE.py
      - name: S89 native config regression
        run: python tools/S89_WINDOWS_G08_PARTY_CONFIG_EDITOR_SMOKE.py
      - name: S88 native DWM regression
        run: python tools/S88_WINDOWS_C04_AUTO_SOURCE_LOSS_DWM_FAULT_SMOKE.py
      - name: S76 native DWM regression
        run: python tools/S76_WINDOWS_C15_REFRESH_DWM_FAULT_SMOKE.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s98-native-read-epoch-TWO-TEST-PIDs-NO-GAME
          path: |
            artifacts/s98/
            artifacts/s97/
            artifacts/s96/
            artifacts/s95/
            artifacts/s94/
            artifacts/s93/
            artifacts/s92/
            artifacts/s91/
            artifacts/s90/
            artifacts/s89/
            artifacts/s88/
            artifacts/s76/
            artifacts/s86/
          if-no-files-found: warn
