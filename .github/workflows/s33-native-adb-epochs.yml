name: S33 offline serial epoch reconnect reboot invalidation

on:
  push:
    paths:
      - "src/adb_serial_epochs.py"
      - "tests/test_s33.py"
      - "tools/S33_WINDOWS_ADB_EPOCH_SMOKE.py"
      - ".github/workflows/s33-native-adb-epochs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s33-native:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile Stage S and S33 smoke
        run: python -m compileall -q src tests tools/S33_WINDOWS_ADB_EPOCH_SMOKE.py
      - name: S01-S33 complete Python unit regression
        run: python -m unittest discover -s tests -p "test_s*.py" -v
      - name: S33 actual Windows offline epoch fixture and real host PID
        run: python tools/S33_WINDOWS_ADB_EPOCH_SMOKE.py
      - name: S32 hint timestamp regressions
        run: python tools/S32_WINDOWS_HINT_PROVENANCE_SMOKE.py
      - name: S31 offline ADB clone identity
        run: python tools/S31_WINDOWS_OFFLINE_ADB_IDENTITY_SMOKE.py
      - name: S30 native process staleness
        run: python tools/S30_WINDOWS_COUNT_PROVENANCE_SMOKE.py
      - name: S29 native Toolhelp counts
        run: python tools/S29_WINDOWS_PARTIAL_COUNT_SMOKE.py
      - name: S28 native PE file preflight
        run: python tools/S28_WINDOWS_LAUNCH_INPUTS_SMOKE.py
      - name: S27 delayed native HWND
        run: python tools/S27_WINDOWS_PID_HWND_HANDOFF_SMOKE.py
      - name: S26 native PID HWND
        run: python tools/S26_WINDOWS_F05_PREFLIGHT_HWND_SMOKE.py
      - name: S25 native Login path
        run: python tools/S25_WINDOWS_LOGIN_FOLDER_SMOKE.py
      - name: S24 native Tk destroy
        run: python tools/S24_WINDOWS_DESTROY_SMOKE.py
      - name: S23 session tee
        run: python tools/S23_WINDOWS_TEE_SMOKE.py
      - name: S22 startup diagnostics
        run: python tools/S22_WINDOWS_DIAGNOSTICS_SMOKE.py
      - name: S21 native mutex
        run: python tools/S21_WINDOWS_MUTEX_SMOKE.py
      - name: S20 native three HWNDs
        run: python tools/S20_WINDOWS_THREE_HWND_COMBINED_SMOKE.py
      - name: S10 native Start window discovery
        run: python tools/S10_WINDOWS_START_VIEW_SMOKE.py
      - name: Save Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s33-native-offline-epoch-evidence
          path: |
            artifacts/s33/
            artifacts/s32/
            artifacts/s31/
            artifacts/s30/
            artifacts/s29/
            artifacts/s28/
            artifacts/s27/
            artifacts/s26/
            artifacts/s25/
            artifacts/s24/
            artifacts/s23/
            artifacts/s22/
            artifacts/s21/
            artifacts/s20/
            artifacts/s10/
          if-no-files-found: warn
