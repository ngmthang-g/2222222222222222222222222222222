name: S153 C16 original UnityCrashHandler taskkill, test-owned Win64 ONLY
on:
  pull_request:
    paths:
      - "src/close_windows.py"
      - "tests/test_s153.py"
      - "tools/S153_WINDOWS_C16_CRASHHANDLER_SMOKE.py"
      - ".github/workflows/s153-c16-crashhandler.yml"
  push:
    paths:
      - "src/close_windows.py"
      - "tests/test_s153.py"
      - "tools/S153_WINDOWS_C16_CRASHHANDLER_SMOKE.py"
      - ".github/workflows/s153-c16-crashhandler.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s153-real-windows-c16-original-helper:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"
          architecture: x64
      - run: python -m pip install Pillow==11.3.0
      - run: python -m compileall -q src tests tools
      - run: python -m unittest discover -s tests -p "test_s*.py" -v
      - run: python tools/S86_AUDIT_SOURCE_BUILD_GAPS.py
      - name: Exact original taskkill only on isolated test-owned process
        run: python tools/S153_WINDOWS_C16_CRASHHANDLER_SMOKE.py
      - name: Inherited real Win64 C16 three TEST-OWNED Tk game WM_CLOSE messages
        run: python tools/S16_WINDOWS_TEST_OWNED_CLOSE_SMOKE.py
      - name: S152 C14 native Info exception cleanup
        run: python tools/S152_WINDOWS_C14_AUTH_EXCEPTION_SMOKE.py
      - name: Inherited S151 100-row Login wheel
        run: python tools/S151_WINDOWS_LOGIN_ACCOUNT_WHEEL_SMOKE.py
      - name: Inherited S150 C12 read-only HWND observer
        run: python tools/S150_WINDOWS_C12_OBSERVER_OWNED_SMOKE.py
      - name: Inherited S146 C12 two real test-owned HWNDs
        run: python tools/S146_WINDOWS_C12_SHOW_ORIGIN_SMOKE.py
      - name: Signed Info negative product gate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/s153 | Out-Null
          python src/TLMTool.py 2>&1 | Out-File -Encoding utf8 artifacts/s153/product_gate.txt
          if ($LASTEXITCODE -ne 2) { throw "S153_UNVERIFIED_PRODUCT_GUI_STARTED" }
          if ((Get-Content -Raw artifacts/s153/product_gate.txt) -notmatch "S01 BLOCKED") { throw "S153_INFO_GATE_BYPASS" }
          Write-Host "S153_PRODUCT=EXPLICITLY_BLOCKED_NO_GUI_NOT_PRODUCT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S153_C16_NATIVE_CRASHHANDLER_TEST_OWNED_NOT_PRODUCT
          path: |
            artifacts/s153/
            artifacts/s16/
            artifacts/s152/
            artifacts/s151/
            artifacts/s150/
            artifacts/s146/
            artifacts/s86/source_and_product_gate_audit.json
          if-no-files-found: warn
