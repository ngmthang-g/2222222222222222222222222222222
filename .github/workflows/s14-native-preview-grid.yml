name: S14 Windows original-backed preview grid and reorder

on:
  push:
    paths:
      - "src/preview_layout.py"
      - "src/start_tab.py"
      - "tests/test_s14.py"
      - "tools/S14_WINDOWS_PREVIEW_GRID_SMOKE.py"
      - ".github/workflows/s14-native-preview-grid.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-backed-grid:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout actual committed source
        uses: actions/checkout@v4
      - name: Set up Windows Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Compile all stage source and tests
        run: python -m compileall -q src tests tools/S14_WINDOWS_PREVIEW_GRID_SMOKE.py
      - name: Run all S01–S14 source regressions
        run: python -m unittest discover -s tests -p "test_s*.py" -v
      - name: Run native Tk four-HWND DWM functional grid/reorder verification
        run: python tools/S14_WINDOWS_PREVIEW_GRID_SMOKE.py
      - name: Upload independent S14 JSON proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s14-windows-native-grid-order
          path: artifacts/s14/
          if-no-files-found: warn
