name: S99 G10 original snapshot display read-only native TWO TEST PIDs
on:
  push:
    paths:
      - "src/party_snapshot_presentation.py"
      - "tests/test_s99.py"
      - "tools/S99_WINDOWS_G10_TWO_PID_SNAPSHOT_PRESENTATION_SMOKE.py"
      - ".github/workflows/s99-party-snapshot-native.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s99-native:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install baseline regression image dependency
        run: python -m pip install Pillow==11.3.0
      - name: Compile complete source tests tools
        run: python -m compileall -q src tests tools
      - name: Full S01 through S99 Python regression
        run: python -m unittest discover -s tests -p "test_s*.py" -v
      - name: S86 all source audit and fail-closed product
        run: python tools/S86_AUDIT_SOURCE_BUILD_GAPS.py
      - name: S99 native original-style diagnostic presentation two genuine test PIDs
        run: python tools/S99_WINDOWS_G10_TWO_PID_SNAPSHOT_PRESENTATION_SMOKE.py
      - name: S98 native epoch regression two test PIDs
        run: python tools/S98_WINDOWS_G10_TWO_PID_EPOCH_SMOKE.py
      - name: S97 native member diagnostic two test PIDs
        run: python tools/S97_WINDOWS_G10_TWO_PID_MEMBER_SNAPSHOT_SMOKE.py
      - name: S96 native join report two test PIDs
        run: python tools/S96_WINDOWS_G10_TWO_PID_BURST_REPORT_SMOKE.py
      - name: S95 native cancellable team wait
        run: python tools/S95_WINDOWS_G10_TEAM_WAIT_NATIVE_SMOKE.py
      - name: S94 native identity
        run: python tools/S94_WINDOWS_G10_TEAM_IDENTITY_NATIVE_SMOKE.py
      - name: S93 native owner status
        run: python tools/S93_WINDOWS_G09_TK_OWNER_STATUS_SMOKE.py
      - name: S92 native cancel
        run: python tools/S92_WINDOWS_G09_PARTY_EVENT_NATIVE_SMOKE.py
      - name: S91 native ready list
        run: python tools/S91_WINDOWS_G02_PARTY_READY_NATIVE_SMOKE.py
      - name: S90 native roster
        run: python tools/S90_WINDOWS_G02_PARTY_ROSTER_NATIVE_SMOKE.py
      - name: S89 native settings
        run: python tools/S89_WINDOWS_G08_PARTY_CONFIG_EDITOR_SMOKE.py
      - name: S88 native DWM source-loss
        run: python tools/S88_WINDOWS_C04_AUTO_SOURCE_LOSS_DWM_FAULT_SMOKE.py
      - name: S76 native DWM cleanup
        run: python tools/S76_WINDOWS_C15_REFRESH_DWM_FAULT_SMOKE.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s99-original-team-snapshot-NO-GAME-TWO-TEST-PIDs
          path: |
            artifacts/s99/
            artifacts/s98/
            artifacts/s97/
            artifacts/s96/
            artifacts/s95/
            artifacts/s94/
            artifacts/s93/
            artifacts/s92/
            artifacts/s91/
            artifacts/s90/
            artifacts/s89/
            artifacts/s88/
            artifacts/s76/
            artifacts/s86/
          if-no-files-found: warn
