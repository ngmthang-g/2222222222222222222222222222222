name: S89 Party G08 real config editor and E05 settings - NO GAME
on:
  push:
    paths:
      - "src/party_group_config.py"
      - "src/party_settings_editor.py"
      - "tests/test_s89.py"
      - "tools/S89_WINDOWS_G08_PARTY_CONFIG_EDITOR_SMOKE.py"
      - ".github/workflows/s89-party-real-config.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s89-native:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install pinned screenshot regression requirement
        run: python -m pip install Pillow==11.3.0
      - name: Compile all reconstruction Python sources and tests
        run: python -m compileall -q src tests tools
      - name: S01 to S89 entire Python unit regression
        run: python -m unittest discover -s tests -p "test_s*.py" -v
      - name: S86 real source inventory and fail-closed product bootstrap
        run: python tools/S86_AUDIT_SOURCE_BUILD_GAPS.py
      - name: S89 real Windows Party configuration-only Tk callback + INI
        run: python tools/S89_WINDOWS_G08_PARTY_CONFIG_EDITOR_SMOKE.py
      - name: S88 genuine DWM source-loss fault guard regression
        run: python tools/S88_WINDOWS_C04_AUTO_SOURCE_LOSS_DWM_FAULT_SMOKE.py
      - name: S76 explicit native DWM cleanup regression
        run: python tools/S76_WINDOWS_C15_REFRESH_DWM_FAULT_SMOKE.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s89-party-config-native-test-only-not-game
          path: |
            artifacts/s89/
            artifacts/s88/
            artifacts/s76/
            artifacts/s86/
          if-no-files-found: warn
