name: S125 H12 background character samples read-only Tk - NOT PRODUCT
on:
  push:
    paths:
      - "src/train_character_samples.py"
      - "src/train_account_rows.py"
      - "tests/test_s125.py"
      - "tools/S125_WINDOWS_TRAIN_CHARACTER_SAMPLES_SMOKE.py"
      - ".github/workflows/s125-train-character-samples.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s125-native:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"
          architecture: x64
      - run: python -m pip install Pillow==11.3.0
      - run: python -m compileall -q src tests tools
      - run: python -m unittest discover -s tests -p "test_s*.py" -v
      - run: python tools/S86_AUDIT_SOURCE_BUILD_GAPS.py
      - name: S125 actual Tk Win32 async sample producer/UI consumer
        run: python tools/S125_WINDOWS_TRAIN_CHARACTER_SAMPLES_SMOKE.py
      - name: Inherited S124 S123 S122 S121 S120 S119
        run: |
          python tools/S124_WINDOWS_TRAIN_AUTH_GATE_SMOKE.py
          python tools/S123_WINDOWS_TRAIN_ACCOUNT_ROWS_SMOKE.py
          python tools/S122_WINDOWS_FARM_ACCOUNT_COMBO_SMOKE.py
          python tools/S121_WINDOWS_FARM_SAVED_EDITOR_SMOKE.py
          python tools/S120_WINDOWS_FARM_ORIGINAL_MAPS_SMOKE.py
          python tools/S119_WINDOWS_FARM_COORDINATES_SMOKE.py
      - name: Inherited Party Login native
        run: |
          python tools/S118_WINDOWS_PARTY_AFTER_RADIO_SMOKE.py
          python tools/S89_WINDOWS_G08_PARTY_CONFIG_EDITOR_SMOKE.py
          python tools/S91_WINDOWS_G02_PARTY_READY_NATIVE_SMOKE.py
          python tools/S93_WINDOWS_G09_TK_OWNER_STATUS_SMOKE.py
          python tools/S117_WINDOWS_F02_SAVE_FEEDBACK_SMOKE.py
          python tools/S116_WINDOWS_LOGIN_EXISTING_ACCOUNT_SMOKE.py
      - name: Real signed Info still blocks product entrypoint
        shell: pwsh
        run: |
          python src/TLMTool.py 2>&1 | Out-File -Encoding utf8 artifacts/s125/gate.txt
          if ($LASTEXITCODE -ne 2) { throw "UNVERIFIED_PRODUCT_GUI_STARTED" }
          if ((Get-Content -Raw artifacts/s125/gate.txt) -notmatch "S01 BLOCKED") { throw "AUTH_GATE_MISSING" }
          Write-Host "S125_PRODUCT=EXPLICITLY_BLOCKED_NO_GUI_NOT_PRODUCT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S125_NATIVE_WIN32_TK_BACKGROUND_READ_ONLY_PIPELINE_NOT_PRODUCT
          path: |
            artifacts/s125/
            artifacts/s86/source_and_product_gate_audit.json
          if-no-files-found: warn
