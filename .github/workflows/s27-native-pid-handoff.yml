name: S27 F05 native bounded PID-HWND readiness handoff

on:
  push:
    paths:
      - "src/login_window_handoff.py"
      - "tests/test_s27.py"
      - "tools/S27_WINDOWS_PID_HWND_HANDOFF_SMOKE.py"
      - ".github/workflows/s27-native-pid-handoff.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s27-native:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Compile Stage S
        run: python -m compileall -q src tests tools/S27_WINDOWS_PID_HWND_HANDOFF_SMOKE.py
      - name: S01-S27 full Python unit regressions
        run: python -m unittest discover -s tests -p "test_s*.py" -v
      - name: Native S27 delayed HWND, cancel, timeout and PID protection
        run: python tools/S27_WINDOWS_PID_HWND_HANDOFF_SMOKE.py
      - name: S26 Win32 preflight regression
        run: python tools/S26_WINDOWS_F05_PREFLIGHT_HWND_SMOKE.py
      - name: S25 native Login directory regression
        run: python tools/S25_WINDOWS_LOGIN_FOLDER_SMOKE.py
      - name: S24 native Destroy/DWM regression
        run: python tools/S24_WINDOWS_DESTROY_SMOKE.py
      - name: S23 tee session regression
        run: python tools/S23_WINDOWS_TEE_SMOKE.py
      - name: S22 diagnostics regression
        run: python tools/S22_WINDOWS_DIAGNOSTICS_SMOKE.py
      - name: S21 mutex regression
        run: python tools/S21_WINDOWS_MUTEX_SMOKE.py
      - name: S20 three-window DWM regression
        run: python tools/S20_WINDOWS_THREE_HWND_COMBINED_SMOKE.py
      - name: S10 read-only Start regression
        run: python tools/S10_WINDOWS_START_VIEW_SMOKE.py
      - name: Upload proof even if a step fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s27-native-pid-ready-evidence
          path: |
            artifacts/s27/
            artifacts/s26/
            artifacts/s25/
            artifacts/s24/
            artifacts/s23/
            artifacts/s22/
            artifacts/s21/
            artifacts/s20/
            artifacts/s10/
          if-no-files-found: warn
