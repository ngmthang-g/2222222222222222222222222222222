name: S94 G10 Party RoleID TeamID HWND PID read-only - TEST OWNED
on:
  push:
    paths:
      - "src/party_team_identity.py"
      - "tests/test_s94.py"
      - "tools/S94_WINDOWS_G10_TEAM_IDENTITY_NATIVE_SMOKE.py"
      - ".github/workflows/s94-party-team-identity-native.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s94-native:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install existing Windows regression image dependency
        run: python -m pip install Pillow==11.3.0
      - name: Compile all Python src tests tools
        run: python -m compileall -q src tests tools
      - name: Full S01-S94 Python test regression
        run: python -m unittest discover -s tests -p "test_s*.py" -v
      - name: Audit source manifest and enforce blocked product bootstrap
        run: python tools/S86_AUDIT_SOURCE_BUILD_GAPS.py
      - name: S94 read-only original G10 TeamID sentinels true HWND PID
        run: python tools/S94_WINDOWS_G10_TEAM_IDENTITY_NATIVE_SMOKE.py
      - name: S93 read-only Party Tk owner status
        run: python tools/S93_WINDOWS_G09_TK_OWNER_STATUS_SMOKE.py
      - name: S92 real cancellable Party thread events
        run: python tools/S92_WINDOWS_G09_PARTY_EVENT_NATIVE_SMOKE.py
      - name: S91 real three-column Party ready Tk labels
        run: python tools/S91_WINDOWS_G02_PARTY_READY_NATIVE_SMOKE.py
      - name: S90 Party real HWND PID roster
        run: python tools/S90_WINDOWS_G02_PARTY_ROSTER_NATIVE_SMOKE.py
      - name: S89 real Party configuration Tk INI
        run: python tools/S89_WINDOWS_G08_PARTY_CONFIG_EDITOR_SMOKE.py
      - name: S88 DWM lost source regression
        run: python tools/S88_WINDOWS_C04_AUTO_SOURCE_LOSS_DWM_FAULT_SMOKE.py
      - name: S76 real DWM source fault regression
        run: python tools/S76_WINDOWS_C15_REFRESH_DWM_FAULT_SMOKE.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s94-party-team-identity-real-test-hwnd-no-game
          path: |
            artifacts/s94/
            artifacts/s93/
            artifacts/s92/
            artifacts/s91/
            artifacts/s90/
            artifacts/s89/
            artifacts/s88/
            artifacts/s76/
            artifacts/s86/
          if-no-files-found: warn
