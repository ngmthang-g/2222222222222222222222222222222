name: S155 G02 real Party roster E03 authorized-only lifecycle native Win64 NOT PRODUCT
on:
  pull_request:
    paths:
      - "src/source_backed_tab_builders.py"
      - "src/party_ready_authorized_tab.py"
      - "tests/test_s155.py"
      - "tools/S155_WINDOWS_PARTY_READY_LIFECYCLE_SMOKE.py"
      - ".github/workflows/s155-g02-party-ready-lifecycle.yml"
  push:
    paths:
      - "src/source_backed_tab_builders.py"
      - "src/party_ready_authorized_tab.py"
      - "tests/test_s155.py"
      - "tools/S155_WINDOWS_PARTY_READY_LIFECYCLE_SMOKE.py"
      - ".github/workflows/s155-g02-party-ready-lifecycle.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-g02-party-e03:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"
          architecture: x64
      - run: python -m pip install Pillow==11.3.0
      - run: python -m compileall -q src tests tools
      - run: python -m unittest discover -s tests -p "test_s*.py" -v
      - run: python tools/S86_AUDIT_SOURCE_BUILD_GAPS.py
      - name: S155 actual Win64 Party E03 authorized G02 read-only roster lifecycle
        run: python tools/S155_WINDOWS_PARTY_READY_LIFECYCLE_SMOKE.py
      - name: S154 real Tk signed-gated Party G08 config editor regression
        run: python tools/S154_WINDOWS_PARTY_BUILDER_SMOKE.py
      - name: S91 native three-column selected-ready game HWND generation regression
        run: python tools/S91_WINDOWS_G02_PARTY_READY_NATIVE_SMOKE.py
      - name: S90 native Party 3s role worker cache/identity regression
        run: python tools/S90_WINDOWS_G02_PARTY_ROSTER_NATIVE_SMOKE.py
      - name: S153 original C16 test-owned crash process
        run: python tools/S153_WINDOWS_C16_CRASHHANDLER_SMOKE.py
      - name: S152 real C14 native DWM error cleanup
        run: python tools/S152_WINDOWS_C14_AUTH_EXCEPTION_SMOKE.py
      - name: S151 real Login Tk wheel
        run: python tools/S151_WINDOWS_LOGIN_ACCOUNT_WHEEL_SMOKE.py
      - name: S150 C12 native observer
        run: python tools/S150_WINDOWS_C12_OBSERVER_OWNED_SMOKE.py
      - name: S146 original C12 native two-HWND branch regression
        run: python tools/S146_WINDOWS_C12_SHOW_ORIGIN_SMOKE.py
      - name: Genuine signed Info must keep product UI closed
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/s155 | Out-Null
          python src/TLMTool.py 2>&1 | Out-File -Encoding utf8 artifacts/s155/product_gate.txt
          if ($LASTEXITCODE -ne 2) { throw "S155_UNVERIFIED_PRODUCT_GUI_STARTED" }
          if ((Get-Content -Raw artifacts/s155/product_gate.txt) -notmatch "S01 BLOCKED") { throw "S155_INFO_GATE_BYPASS" }
          Write-Host "S155_PRODUCT=EXPLICITLY_BLOCKED_NO_GUI_NOT_PRODUCT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S155_REAL_PARTY_G02_NATIVE_E03_TEST_OWNED_NOT_PRODUCT
          path: |
            artifacts/s155/
            artifacts/s154/
            artifacts/s91/
            artifacts/s90/
            artifacts/s153/
            artifacts/s152/
            artifacts/s151/
            artifacts/s150/
            artifacts/s146/
            artifacts/s86/source_and_product_gate_audit.json
          if-no-files-found: warn
