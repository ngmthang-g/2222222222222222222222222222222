name: S05 native Windows Tk Info preview

on:
  push:
    paths:
      - "tools/S05_WINDOWS_TK_SMOKE.py"
      - ".github/workflows/s05-native-info-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-tk-info-only:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact committed source
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Pillow for optional screenshot capture
        run: python -m pip install "Pillow==11.3.0"
      - name: Verify all Stage S source and tests compile
        run: python -m compileall -q src tests tools/S05_WINDOWS_TK_SMOKE.py
      - name: Recheck all S01-S04 headless regressions
        run: python -m unittest discover -s tests -p "test_s*.py" -v
      - name: Real Windows Tk Info-only smoke and geometry metrics
        run: python tools/S05_WINDOWS_TK_SMOKE.py
      - name: Preserve screenshot and machine-readable results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s05-native-tk-preview
          path: artifacts/s05/
          if-no-files-found: warn
