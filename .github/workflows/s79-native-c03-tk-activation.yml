      - ".github/workflows/s74-native-c14-host-lifecycle.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s79-native:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install screenshot-only test dependency
        run: python -m pip install Pillow==11.3.0
      - name: Compile Stage S and S79
        run: python -m compileall -q src tests tools/S59_WINDOWS_MEASURED_AUTO_BUTTONS_SMOKE.py
      - name: Run complete S01-S79 regression
        run: python -m unittest discover -s tests -p "test_s*.py" -v
      - name: S79 real native Tk header and surface clicks activate only verified live HWND
        run: python tools/S79_WINDOWS_C03_TK_PREVIEW_ACTIVATION_SMOKE.py
      - name: S78 real native overlay WndProc click messages activate verified source HWND
        run: python tools/S78_WINDOWS_C03_PREVIEW_NATIVE_CLICK_SMOKE.py
      - name: S77 real E08 Tk and native DWM Stop/Shutdown failure releases other owners
        run: python tools/S77_WINDOWS_E08_NATIVE_EXIT_CLEANUP_SMOKE.py
      - name: S76 real native C15 DWM error injection still destroys every preview Tk frame
        run: python tools/S76_WINDOWS_C15_REFRESH_DWM_FAULT_SMOKE.py
      - name: S74 real native DWM and topmost host close after detached HWND list changes
        run: python tools/S74_WINDOWS_C14_HOST_CLOSE_ON_CHANGE_SMOKE.py
      - name: S73 genuine Win32 one-shot scan detects TEST-OWNED HWND disappearance
        run: python tools/S73_WINDOWS_C14_ONE_SHOT_SCANNER_SMOKE.py
      - name: S72 real native test-owned HWND disappear and release DWM
        run: python tools/S72_WINDOWS_C14_DETACHED_LIST_OBSERVER_SMOKE.py
      - name: S71 real native DWM unregister injected failure attempts all cleanup
        run: python tools/S71_WINDOWS_DWM_TEARDOWN_ERROR_SMOKE.py
      - name: S70 native topmost Tk C14 owner and DWM-before-destroy proof
        run: python tools/S70_WINDOWS_DETACHED_TOPMOST_HOST_SMOKE.py
      - name: S69 actual Windows E05 detached settings persistence without autoopen
        run: python tools/S69_WINDOWS_C14_SETTINGS_SMOKE.py
      - name: S68 real Windows detached DWM host and independent lifecycle
        run: python tools/S68_WINDOWS_DETACHED_DWM_SMOKE.py
      - name: S67 real Win32 C06 post-move rectangle and identity proof
        run: python tools/S67_WINDOWS_C06_POSTMOVE_SMOKE.py
      - name: S66 real Windows horizontal vertical move-only 50px HWND
        run: python tools/S66_WINDOWS_C06_HV_STACK_SMOKE.py
      - name: S64 actual Windows HWND PID and TEST-ONLY RoleName gate
        run: python tools/S64_WINDOWS_ROLE_PROVENANCE_SMOKE.py
      - name: S63 actual Windows Tk after 1000ms cadence and revoke
        run: python tools/S63_WINDOWS_C07_CLOCK_SMOKE.py
      - name: S62 real Tk Start C07 worker lifecycle (TEST ONLY)
        run: python tools/S62_WINDOWS_C07_START_NATIVE_SMOKE.py
      - name: S61 verified real native C07 reset (TEST ONLY)
        run: python tools/S61_WINDOWS_C07_RESET_NATIVE_SMOKE.py
      - name: S60 false-positive window geometry cases
        run: python -m unittest discover -s tests -p "test_s60.py" -v
      - name: S59 measured real Tk buttons invoke C10 C11 Win32
        run: python tools/S59_WINDOWS_MEASURED_AUTO_BUTTONS_SMOKE.py
      - name: S58 native C12 reset after verified C11 geometry only
