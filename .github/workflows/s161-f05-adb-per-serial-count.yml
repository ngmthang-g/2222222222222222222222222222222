name: S161 original E04 emulator game pidof per serial real Win64 CLI fixture NOT ANDROID
on:
  pull_request:
    paths:
      - "src/login_emulator_game_capacity.py"
      - "tests/test_s161.py"
      - "tools/S161_WINDOWS_F05_ADB_GAME_COUNT_SMOKE.py"
      - ".github/workflows/s161-f05-adb-per-serial-count.yml"
  push:
    paths:
      - "src/login_emulator_game_capacity.py"
      - "tests/test_s161.py"
      - "tools/S161_WINDOWS_F05_ADB_GAME_COUNT_SMOKE.py"
      - ".github/workflows/s161-f05-adb-per-serial-count.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s161-native-win64-emulator-game-pidof:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"
          architecture: x64
      - run: python -m pip install Pillow==11.3.0
      - run: python -m compileall -q src tests tools
      - run: python -m unittest discover -s tests -p "test_s*.py" -v
      - run: python tools/S86_AUDIT_SOURCE_BUILD_GAPS.py
      - name: S161 actual Windows subprocess ADB CLI protocol emulator count TEST ONLY
        run: python tools/S161_WINDOWS_F05_ADB_GAME_COUNT_SMOKE.py
      - name: S160 true Win64 game-named EXE native process count
        run: python tools/S160_WINDOWS_F05_LIVE_EXE_COUNT_SMOKE.py
      - name: S26 original F05 native extra-one limit regression
        run: python tools/S26_WINDOWS_F05_PREFLIGHT_HWND_SMOKE.py
      - name: S159 native F05 1366x768 conditional resize
        run: python tools/S159_WINDOWS_LOGIN_NATIVE_RESIZE_SMOKE.py
      - name: S158 actual child PID HWND serialized handoff
        run: python tools/S158_WINDOWS_F05_SERIAL_PID_HANDOFF_SMOKE.py
      - name: S157 actual Windows child safe environment
        run: python tools/S157_WINDOWS_F05_CLEAN_ENV_SMOKE.py
      - name: S156 actual Win32 F05 PID HWND
        run: python tools/S156_WINDOWS_F05_PID_HWND_SMOKE.py
      - name: S155 Party native 3 HWND lifecycle
        run: python tools/S155_WINDOWS_PARTY_READY_LIFECYCLE_SMOKE.py
      - name: S154 Party native G08 config
        run: python tools/S154_WINDOWS_PARTY_BUILDER_SMOKE.py
      - name: S153 C16 taskkill test-owned Win64
        run: python tools/S153_WINDOWS_C16_CRASHHANDLER_SMOKE.py
      - name: S152 C14 real DWM native cleanup
        run: python tools/S152_WINDOWS_C14_AUTH_EXCEPTION_SMOKE.py
      - name: S151 Login Tk mousewheel
        run: python tools/S151_WINDOWS_LOGIN_ACCOUNT_WHEEL_SMOKE.py
      - name: S150 C12 read-only HWND observer
        run: python tools/S150_WINDOWS_C12_OBSERVER_OWNED_SMOKE.py
      - name: S146 C12 2 native HWND hide/show
        run: python tools/S146_WINDOWS_C12_SHOW_ORIGIN_SMOKE.py
      - name: Signed original Info must still block unverified product
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/s161 | Out-Null
          python src/TLMTool.py 2>&1 | Out-File -Encoding utf8 artifacts/s161/product_gate.txt
          if ($LASTEXITCODE -ne 2) { throw "S161_UNVERIFIED_PRODUCT_GUI_STARTED" }
          if ((Get-Content -Raw artifacts/s161/product_gate.txt) -notmatch "S01 BLOCKED") { throw "S161_INFO_GATE_BYPASS" }
          Write-Host "S161_PRODUCT=EXPLICITLY_BLOCKED_NO_GUI_NOT_PRODUCT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S161_F05_ADB_PIDOF_WIN64_CLI_PROTOCOL_FIXTURE_NOT_REAL_ANDROID
          path: |
            artifacts/s161/
            artifacts/s160/
            artifacts/s159/
            artifacts/s158/
            artifacts/s157/
            artifacts/s156/
            artifacts/s155/
            artifacts/s154/
            artifacts/s153/
            artifacts/s152/
            artifacts/s151/
            artifacts/s150/
            artifacts/s146/
            artifacts/s86/source_and_product_gate_audit.json
          if-no-files-found: warn
