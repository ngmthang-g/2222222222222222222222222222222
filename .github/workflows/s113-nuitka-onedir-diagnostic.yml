name: S113 Windows Nuitka standalone folder diagnostic ONLY — NOT PRODUCT
on:
  push:
    paths:
      - "requirements-build-s113.txt"
      - "tools/S113_VERIFY_NUITKA_DIAGNOSTIC.py"
      - "tools/S113_BUILD_NUITKA_DIAGNOSTIC.ps1"
      - "tests/test_s113.py"
      - ".github/workflows/s113-nuitka-onedir-diagnostic.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s113-nuitka-standalone:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"
          architecture: "x64"
      - name: Verify compile and all previous Python unit tests
        run: |
          python -m compileall -q src tests tools
          python -m pip install Pillow==11.3.0
          python -m unittest discover -s tests -p "test_s*.py" -v
      - name: Existing S86 source audit — product still blocked
        run: python tools/S86_AUDIT_SOURCE_BUILD_GAPS.py
      - name: Install pinned Nuitka diagnostic compiler
        run: python -m pip install --disable-pip-version-check -r requirements-build-s113.txt
      - name: Build genuine Nuitka standalone folder and execute EXE from clean cwd
        shell: pwsh
        run: ./tools/S113_BUILD_NUITKA_DIAGNOSTIC.ps1
      - name: Native S112 original F10 radios no game
        run: python tools/S112_WINDOWS_LOGIN_AFTER_RADIO_SMOKE.py
      - name: Native S111 actual F09 HHMM selectors no game
        run: python tools/S111_WINDOWS_LOGIN_SCHEDULE_TIME_SMOKE.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S113_NUITKA_STANDALONE_DIAGNOSTIC_ONLY_NOT_PRODUCT_x64
          path: |
            artifacts/s113/TLMTool.dist/
            artifacts/s113/verification.json
            artifacts/s86/source_and_product_gate_audit.json
            artifacts/s111/
            artifacts/s112/
          if-no-files-found: warn
