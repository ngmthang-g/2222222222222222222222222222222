name: S91 Party G02 verified ready list 3 columns - TEST OWNED
on:
  push:
    paths:
      - "src/party_ready_list.py"
      - "tests/test_s91.py"
      - "tools/S91_WINDOWS_G02_PARTY_READY_NATIVE_SMOKE.py"
      - ".github/workflows/s91-party-ready-native.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s91-native:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install required prior image regression dependency
        run: python -m pip install Pillow==11.3.0
      - name: Compile every Stage S Python file
        run: python -m compileall -q src tests tools
      - name: Full Stage S01 through S91 Python unit regression
        run: python -m unittest discover -s tests -p "test_s*.py" -v
      - name: Real S86 source audit and guarded no-product bootstrap
        run: python tools/S86_AUDIT_SOURCE_BUILD_GAPS.py
      - name: S91 REAL Win32 Tk Party ready list with 3 columns
        run: python tools/S91_WINDOWS_G02_PARTY_READY_NATIVE_SMOKE.py
      - name: S90 real Tk Party source lifecycle regression
        run: python tools/S90_WINDOWS_G02_PARTY_ROSTER_NATIVE_SMOKE.py
      - name: S89 Party Unicode INI user actions regression
        run: python tools/S89_WINDOWS_G08_PARTY_CONFIG_EDITOR_SMOKE.py
      - name: S88 native DWM source loss regression
        run: python tools/S88_WINDOWS_C04_AUTO_SOURCE_LOSS_DWM_FAULT_SMOKE.py
      - name: S76 native DWM C15 fault cleanup regression
        run: python tools/S76_WINDOWS_C15_REFRESH_DWM_FAULT_SMOKE.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s91-party-verified-ready-list-native-test-only-no-game
          path: |
            artifacts/s91/
            artifacts/s90/
            artifacts/s89/
            artifacts/s88/
            artifacts/s76/
            artifacts/s86/
          if-no-files-found: warn
