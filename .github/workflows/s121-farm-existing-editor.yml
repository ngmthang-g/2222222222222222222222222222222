name: S121 native Tk existing Farm coordinate records real settings.ini - not product
on:
  push:
    paths:
      - "src/farm_saved_editor.py"
      - "tests/test_s121.py"
      - "tools/S121_WINDOWS_FARM_SAVED_EDITOR_SMOKE.py"
      - ".github/workflows/s121-farm-existing-editor.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s121-native:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"
          architecture: "x64"
      - name: Install inherited screenshot library
        run: python -m pip install Pillow==11.3.0
      - name: Compile Python modules
        run: python -m compileall -q src tests tools
      - name: Full unit regression
        run: python -m unittest discover -s tests -p "test_s*.py" -v
      - name: S86 full manifest and negative product audit
        run: python tools/S86_AUDIT_SOURCE_BUILD_GAPS.py
      - name: Native S121 real Tk and disk
        run: python tools/S121_WINDOWS_FARM_SAVED_EDITOR_SMOKE.py
      - name: Native prior S120 S119 config
        run: |
          python tools/S120_WINDOWS_FARM_ORIGINAL_MAPS_SMOKE.py
          python tools/S119_WINDOWS_FARM_COORDINATES_SMOKE.py
      - name: Inherited Party Login native
        run: |
          python tools/S118_WINDOWS_PARTY_AFTER_RADIO_SMOKE.py
          python tools/S89_WINDOWS_G08_PARTY_CONFIG_EDITOR_SMOKE.py
          python tools/S91_WINDOWS_G02_PARTY_READY_NATIVE_SMOKE.py
          python tools/S93_WINDOWS_G09_TK_OWNER_STATUS_SMOKE.py
          python tools/S117_WINDOWS_F02_SAVE_FEEDBACK_SMOKE.py
          python tools/S116_WINDOWS_LOGIN_EXISTING_ACCOUNT_SMOKE.py
      - name: Info gate remains fail closed
        shell: pwsh
        run: |
          python src/TLMTool.py 2>&1 | Out-File -Encoding utf8 artifacts/s121/product_gate.txt
          if ($LASTEXITCODE -ne 2) { throw "S121_UNVERIFIED_PRODUCT_ACTIVE" }
          if ((Get-Content -Raw artifacts/s121/product_gate.txt) -notmatch "S01 BLOCKED") { throw "S121_INFO_GUARD_MISSING" }
          Write-Host "S121_PRODUCT=EXPLICITLY_BLOCKED_NO_GUI_NOT_PRODUCT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S121_FARM_EXISTING_PRESETS_TRUE_TK_DISK_ONLY_NOT_PRODUCT
          path: |
            artifacts/s121/
            artifacts/s86/source_and_product_gate_audit.json
          if-no-files-found: warn
