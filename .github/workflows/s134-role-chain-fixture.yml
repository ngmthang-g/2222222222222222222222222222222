name: S134 original O02 read-only role chain fixture and independent SessionData anchor Windows - NOT PRODUCT
on:
  push:
    paths:
      - "src/train_role_chain_validation.py"
      - "docs/tasks/S134.md"
      - "tests/test_s134.py"
      - "tools/S134_WINDOWS_ROLE_CHAIN_FIXTURE_SMOKE.py"
      - ".github/workflows/s134-role-chain-fixture.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s134-native:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"
          architecture: x64
      - run: python -m pip install Pillow==11.3.0
      - run: python -m compileall -q src tests tools
      - run: python -m unittest discover -s tests -p "test_s*.py" -v
      - run: python tools/S86_AUDIT_SOURCE_BUILD_GAPS.py
      - name: S134 native real Win64 read-only self-owned RoleData pointer chain and independent session anchor
        run: python tools/S134_WINDOWS_ROLE_CHAIN_FIXTURE_SMOKE.py
      - name: Inherited S133 Win32 readonly self PE native
        run: python tools/S133_WINDOWS_READONLY_GA_PROBE_SMOKE.py
      - name: Inherited S132 composed true Train native
        run: python tools/S132_WINDOWS_TRAIN_COMPOSITION_SMOKE.py
      - name: Inherited S131 original Farm buff native
        run: python tools/S131_WINDOWS_TRAIN_BUFF_SMOKE.py
      - name: Inherited S130 original town trade native
        run: python tools/S130_WINDOWS_H02_TOWN_TRADE_SMOKE.py
      - name: Inherited S129 original Train settings native
        run: python tools/S129_WINDOWS_H06_H09_TRAIN_CONFIG_SMOKE.py
      - name: Inherited S128 true H02 town native
        run: python tools/S128_WINDOWS_H02_TOWN_SETTINGS_SMOKE.py
      - name: Inherited S127 S126 S125 S124 S123 S122 S121 S120 S119 native
        run: |
          python tools/S127_WINDOWS_H12_STATE_LABEL_SMOKE.py
          python tools/S126_WINDOWS_TRAIN_EXTRA_TRACKER_SMOKE.py
          python tools/S125_WINDOWS_TRAIN_CHARACTER_SAMPLES_SMOKE.py
          python tools/S124_WINDOWS_TRAIN_AUTH_GATE_SMOKE.py
          python tools/S123_WINDOWS_TRAIN_ACCOUNT_ROWS_SMOKE.py
          python tools/S122_WINDOWS_FARM_ACCOUNT_COMBO_SMOKE.py
          python tools/S121_WINDOWS_FARM_SAVED_EDITOR_SMOKE.py
          python tools/S120_WINDOWS_FARM_ORIGINAL_MAPS_SMOKE.py
          python tools/S119_WINDOWS_FARM_COORDINATES_SMOKE.py
      - name: Inherited Party/Login native tests
        run: |
          python tools/S118_WINDOWS_PARTY_AFTER_RADIO_SMOKE.py
          python tools/S89_WINDOWS_G08_PARTY_CONFIG_EDITOR_SMOKE.py
          python tools/S91_WINDOWS_G02_PARTY_READY_NATIVE_SMOKE.py
          python tools/S93_WINDOWS_G09_TK_OWNER_STATUS_SMOKE.py
          python tools/S117_WINDOWS_F02_SAVE_FEEDBACK_SMOKE.py
          python tools/S116_WINDOWS_LOGIN_EXISTING_ACCOUNT_SMOKE.py
      - name: Genuine signed Info gate still rejects product
        shell: pwsh
        run: |
          python src/TLMTool.py 2>&1 | Out-File -Encoding utf8 artifacts/s134/signed_gate.txt
          if ($LASTEXITCODE -ne 2) { throw "S134_UNVERIFIED_PRODUCT_GUI_STARTED" }
          if ((Get-Content -Raw artifacts/s134/signed_gate.txt) -notmatch "S01 BLOCKED") { throw "S134_INFO_GATE_BYPASS" }
          Write-Host "S134_PRODUCT=EXPLICITLY_BLOCKED_NO_GUI_NOT_PRODUCT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S134_READONLY_SELF_OWNED_ROLE_CHAIN_TEST_ONLY_NOT_PRODUCT
          path: |
            artifacts/s134/
            artifacts/s86/source_and_product_gate_audit.json
          if-no-files-found: warn
